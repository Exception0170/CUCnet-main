{% extends "base.html" %}
{% block content %}
<div class="window" style="width:80%; max-width: 600px">
    <div class="window-top-bar">/bin/passwd<span class="fake-close">❌</span></div>
	<div class="window-content">
        <h2>Задайте новый пароль прежде чем продолжить</h2>
        Пароль должен содержать как минимум 8 символов.
        <!-- Warning div - shown if error_message exists -->
        {% if error_message %}
            <div class="warning" style="margin: 15px 0;">
                ⚠ {{ error_message }}
            </div>
        {% endif %}
        <div class="list-entries">
            <form method="POST" id="passwordForm" class="login-form">
                <label for="username">Введите пароль</label>
                <input id="username" name="password1" type="password" required placeholder="Пароль 1"><br>
                <label for="password">Повторите пароль</label>
                <input id="password" name="password2" type="password" required placeholder="Тот же пароль"><br>
                <button type="submit" style="font-family: TDAtext" class="link-button"> > Submit < </button>
            </form>
        </div>
    </div>
</div>
<script>
// Optional: Hide warning when user starts typing (for better UX)
document.addEventListener('DOMContentLoaded', function() {
    const warningDiv = document.querySelector('.warning');
    const usernameInput = document.getElementById('username');
    const passwordInput = document.getElementById('password');

    if (warningDiv) {
        function hideWarning() {
            warningDiv.style.display = 'none';
        }

        if (usernameInput) usernameInput.addEventListener('input', hideWarning);
        if (passwordInput) passwordInput.addEventListener('input', hideWarning);
    }
});
</script>
{% endblock %}
