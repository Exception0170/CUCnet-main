<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }}</title>
    <link rel="stylesheet" href="{{ url_for('static', path='/css/styles.css') }}">
	<link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    <link rel="apple-touch-icon" sizes="180x180" href="{{ url_for('static', path='/img/apple-touch-icon.png') }}">
    <link rel="icon" type="image/png" sizes="32x32" href="{{ url_for('static', path='/img/favicon-32x32.png') }}">
    <link rel="icon" type="image/png" sizes="16x16" href="{{ url_for('static', path='/img/favicon-16x16.png') }}">
    <link rel="manifest" href="{{ url_for('static', path='/site.webmanifest') }}">
</head>
<body>
    <main>
        {% include "account/topbar.html" %}
        <div class="window" style="width:90; max-width:700px">
            <div class="window-top-bar">notepad.exe: {{page_title}}<span class="fake-close">❌</span></div>
            <div class="window-content">
                {% block content %}{% endblock %}
            </div>
        </div>
        <br>
        <a href="/blog" class="link-button">< Назад</a>
    </main>

    <footer>
        <p>* 2025 CUCnet/mainserver</p>
    </footer>
</body>
</html>
